<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sister IQ Test - Prank Edition</title>
    <style>
        /* Advanced CSS with modern design: Dark theme, gradients, animations, flexbox/grid */
        body {
            font-family: 'Arial', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #fff;
            margin: 0;
            padding: 0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
        }
        .container {
            max-width: 800px;
            background: rgba(0, 0, 0, 0.8);
            border-radius: 15px;
            padding: 30px;
            box-shadow: 0 10px 30px rgba(0, 0, 0, 0.5);
            text-align: center;
            animation: fadeIn 1s ease-in;
            position: relative;
        }
        @keyframes fadeIn {
            from { opacity: 0; transform: translateY(-20px); }
            to { opacity: 1; transform: translateY(0); }
        }
        h1 {
            font-size: 3em;
            margin-bottom: 20px;
            text-shadow: 2px 2px 4px rgba(0, 0, 0, 0.7);
        }
        .question {
            font-size: 1.5em;
            margin: 20px 0;
        }
        .timer {
            font-size: 1.2em;
            color: #ff6b6b;
            margin: 10px 0;
        }
        .options {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 15px;
            margin: 20px 0;
            position: relative;
            height: 200px;
        }
        button {
            background: linear-gradient(45deg, #ff6b6b, #feca57);
            border: none;
            padding: 15px 20px;
            font-size: 1.2em;
            border-radius: 10px;
            cursor: pointer;
            transition: transform 0.3s, box-shadow 0.3s;
            color: #fff;
            position: absolute;
            z-index: 1;
        }
        button:hover {
            box-shadow: 0 5px 15px rgba(0, 0, 0, 0.3);
        }
        .result {
            font-size: 2em;
            margin-top: 30px;
            animation: shake 0.5s ease-in-out;
        }
        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            25% { transform: translateX(-5px); }
            75% { transform: translateX(5px); }
        }
        .hidden {
            display: none;
        }
        .emoji {
            font-size: 2em;
            margin: 10px;
        }
        .explanation {
            font-size: 1.2em;
            margin-top: 10px;
            color: #feca57;
        }
    </style>
</head>
<body>
    <div class="container">
        <h1>Sister IQ Test <span class="emoji">🧠</span></h1>
        <div id="quiz">
            <div class="question">Question 1: What's 2 + 2?</div>
            <div class="timer">Time left: <span id="time">10</span> seconds</div>
            <div class="options">
                <button id="btn1" onclick="answer(1)">4</button>
                <button id="btn2" onclick="answer(2)">5</button>
                <button id="btn3" onclick="answer(3)">22</button>
                <button id="btn4" onclick="answer(4)">Fish</button>
            </div>
        </div>
        <div id="result" class="hidden">
            <div class="result">Your IQ is... 0! You're dumber than a rock! 😂</div>
            <div class="explanation">Logically, if you couldn't answer simple questions quickly, your brain must be malfunctioning. Even a toddler could do better!</div>
            <button onclick="restart()">Try Again? (Spoiler: Same result!)</button>
        </div>
    </div>

    <script>
        // JS for quiz logic - always gives a dumb result, with prank elements
        let score = 0;
        let timer;
        let timeLeft = 10;
        const questions = [
            { q: "Question 1: What's 2 + 2?", options: ["4", "5", "22", "Fish"], correct: 0 },
            { q: "Question 2: What color is the sky?", options: ["Blue", "Green", "Purple", "Invisible"], correct: 0 },
            { q: "Question 3: How many fingers do you have?", options: ["10", "11", "9", "None"], correct: 0 },
            { q: "Question 4: What is the capital of France?", options: ["Paris", "London", "Berlin", "Madrid"], correct: 0 },
            { q: "Question 5: How many legs does a spider have?", options: ["8", "6", "10", "4"], correct: 0 }
        ];
        let currentQuestion = 0;
        let correctButton;

        // Function to move button randomly on hover (only for correct answer)
        function moveButton(button) {
            const container = document.querySelector('.options');
            const containerRect = container.getBoundingClientRect();
            const buttonRect = button.getBoundingClientRect();
            const maxX = containerRect.width - buttonRect.width;
            const maxY = containerRect.height - buttonRect.height;
            const randomX = Math.random() * maxX;
            const randomY = Math.random() * maxY;
            button.style.left = randomX + 'px';
            button.style.top = randomY + 'px';
        }

        // Timer function
        function startTimer() {
            timeLeft = 10;
            document.getElementById('time').textContent = timeLeft;
            timer = setInterval(() => {
                timeLeft--;
                document.getElementById('time').textContent = timeLeft;
                if (timeLeft <= 0) {
                    clearInterval(timer);
                    // Auto-fail if time runs out
                    answer(-1); // Special case for timeout
                }
            }, 1000);
        }

        function answer(choice) {
            clearInterval(timer);
            if (choice === -1) {
                // Timeout: always wrong
                score -= 2; // Extra penalty for being slow
            } else if (choice !== questions[currentQuestion].correct) {
                score--; // Wrong answer
            } else {
                score += 1; // Correct, but since correct button moves, this rarely happens
            }
            currentQuestion++;
            if (currentQuestion < questions.length) {
                loadQuestion();
            } else {
                showResult();
            }
        }

        function loadQuestion() {
            document.querySelector('.question').textContent = questions[currentQuestion].q;
            const buttons = document.querySelectorAll('.options button');
            buttons.forEach((btn, i) => {
                btn.textContent = questions[currentQuestion].options[i];
                // Reset positions for new question
                btn.style.left = '';
                btn.style.top = '';
                // Remove previous event listeners
                btn.removeEventListener('mouseover', moveButton);
            });
            // Set correct button to move on hover
            correctButton = buttons[questions[currentQuestion].correct];
            correctButton.addEventListener('mouseover', () => moveButton(correctButton));
            startTimer();
        }

        function showResult() {
            document.getElementById('quiz').classList.add('hidden');
            document.getElementById('result').classList.remove('hidden');
            // Prank: Always say dumb, with logical explanation
            let iq = Math.max(0, score);
            let explanation = "";
            if (score <= 0) {
                explanation = "Logically, your inability to select the correct answer (even when it's obvious) proves severe cognitive impairment. Even a goldfish could do better!";
            } else {
                explanation = "Logically, if you got some right but struggled, your brain is still underperforming. Try harder next time!";
            }
            document.querySelector('.result').innerHTML = `Your IQ is... ${iq}! You're dumber than a potato! 😡 Why are you even trying?`;
            document.querySelector('.explanation').textContent = explanation;
        }

        function restart() {
            score = 0;
            currentQuestion = 0;
            document.getElementById('result').classList.add('hidden');
            document.getElementById('quiz').classList.remove('hidden');
            loadQuestion();
        }

        // Initial load
        loadQuestion();
    </script>
</body>
    </html>
